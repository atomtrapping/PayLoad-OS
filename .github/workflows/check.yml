# One shared application verification workflow, run on every push.
# Separate gates for the application, desktop/mobile browsers, and optional
# local Iceberg publication. Python dependencies stay out of the web runtime.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes this run. The one exception is the
  # default branch, where every commit's result is worth keeping.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  TZ: UTC
  # The screenshot and asset steps must never reach a font or tile host.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: kernel, types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history, not the default depth-1. A shallow clone grafts HEAD to
      # have no parents, so `git rev-list --parents` reports none while the
      # commit object plainly carries two — and src/adapter/selfCapture.test.ts
      # checks the self-observation rail against git as an independent oracle.
      # In a shallow checkout git is not an oracle; it is a different answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      # The kernel is a build input, not an optional extra: `npm test` builds it
      # first because src/state-kernel/store.test.ts runs against the real
      # executable rather than a stub. Both cargo commands pass --locked, which
      # is why native/state-kernel/Cargo.lock has to be committed — this run is
      # what discovered it was not.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/state-kernel/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/state-kernel/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      # `npm run check` is kernel:test && typecheck && lint && test, in that
      # order, and it is what a contributor runs. Running the same command means
      # CI cannot drift from the local gate.
      - run: npm run check

      - run: npm run build

      - run: npm run test:access-smoke

      # The digest fixtures are recomputed by src/fixtures/digest.test.ts, which
      # `npm test` already ran. This asserts the working tree is unchanged by
      # the build itself — a generated file committed stale is the failure mode.
      - name: Working tree is clean after the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'The build modified tracked files. Commit the regenerated output.'
            git status --porcelain
            git diff
            exit 1
          fi

  browser:
    name: browser tests (desktop and Pixel 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts serves the production build, so a source change is
      # invisible to these tests until this step runs.
      - run: npm run build

      - run: npx playwright test --project=desktop --project=mobile

      # The built-in workbench and standalone CLI share real HTTP/database
      # state across backend restarts and a killed mining claim. Fixture-only.
      - run: npm run terminal:qualify -- --storage

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lake:
    name: local Iceberg publication and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --target .stamp/lakehouse-python -r tools/terminal_lake/requirements.lock.txt
      - name: Real Iceberg unit and crash tests
        run: PYTHONPATH="$PWD/.stamp/lakehouse-python:$PWD" python -B -m unittest tools.terminal_lake.test_writer -v
      - name: Terminal to object to Iceberg to SQL acknowledgement
        run: PAYLOAD_LAKE_PYTHON="$(readlink -f "$(command -v python)")" PAYLOAD_LAKE_PYTHON_PACKAGES="$PWD/.stamp/lakehouse-python" npm run terminal:qualify -- --lake --no-browser
